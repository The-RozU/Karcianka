name: Jednorazowa konwersja portretów na WebP

on:
  push:
    branches: [dev-mode]
    paths:
      - ".github/workflows/portraits-webp-once.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Pobierz dev-mode
        uses: actions/checkout@v4
        with:
          ref: dev-mode
          persist-credentials: true
      - name: Python i Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Zainstaluj bibliotekę grafiki
        run: python -m pip install Pillow
      - name: Prawdziwa konwersja i usunięcie duplikatów
        run: python scripts/convert-portraits-once.py
      - name: Sprawdź wszystkie testy
        run: node --test tests/*.test.js
      - name: Zapisz gotowy WebP na dev-mode
        run: |
          set -euo pipefail
          git config user.name "kalon-assets[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Brak zmian po konwersji"; exit 1; }
          git commit -m "fix: rzeczywiste WebP i usunięcie kopii PNG (v0.4.17)"
          git push origin HEAD:dev-mode
